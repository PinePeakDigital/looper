name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. The jobs below only need the source; a workflow with write
# permissions is one compromised action away from pushing to the repo it builds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 29 mutations x the 5-minute per-command verify timeout is a ~150-minute worst case
    # if something makes every verify hang, and the GitHub default is 360. A typical run
    # is a couple of minutes, so this fails fast and cheap instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave the token in .git/config for later steps to pick up.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test -count=1 ./...

      # The suite passing says nothing on its own. This reintroduces each defect in
      # mutations/ and requires the suite to notice. A survivor is a hole: the
      # defect could ship with CI green.
      - name: mutation score
        run: go run ./cmd/looper mutate
