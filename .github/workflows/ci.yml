name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. The jobs below only need the source; a workflow with write
# permissions is one compromised action away from pushing to the repo it builds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The catalog is at least the floor below, so if something made every verify hang the
    # worst case would be at least that many x the 5-minute per-command verify timeout,
    # which already exceeds GitHub's 360-minute default by a wide margin and grows every
    # time the floor rises. Deliberately stated as the relationship and not as a number:
    # it read "400 minutes today" from when the floor was 80 through three raises to 152,
    # where the real figure is 760. A typical run is a couple of minutes — measured at 95s
    # on main at a floor of 111 — so this fails fast and cheap instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the token in .git/config for later steps to pick up.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # No dependencies, so there is no go.sum to key a cache on and `cache: true`
          # only produces a failed restore on every run.
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # internal/record is a port of runlog.py's read half, and its parity gate compares
      # against the thing being replaced. Without the script it calls t.Skip, and `go test`
      # reports a skip as SUCCESS — so this job was green with all its parity subtests inert,
      # which is the whole point of the gate going unmeasured in the one environment that
      # runs it automatically. The skills repo is public, so no token is involved. Pinned to
      # a commit, not a branch: a mutable ref would let the oracle change under the gate.
      - name: fetch the parity oracle
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: narthur/skills
          ref: b9f21b9d58a534e5fcaf154131d0f93fb7b63de3 # narthur/skills main, 2026-10-07
          path: .parity-oracle
          persist-credentials: false

      # internal/record runs here, verbosely and ONCE, because the next assertion needs
      # its per-subtest output. Running it again to check that it ran would re-pay the
      # whole parity cost — ~100 subtests, each spawning a python3 subprocess — on every
      # push, so the rest of the tree is tested separately below.
      - name: go test (record, with the oracle)
        env:
          REVIEW_LOOP_RUNLOG: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/runlog.py
        run: |
          go test -count=1 -v ./internal/record/ > record.log 2>&1 || { cat record.log; exit 1; }
          tail -5 record.log

      # Prove the gate RAN, rather than trusting that it did. A skip is invisible in the
      # step above: it passes identically whether every subtest compared against the Python
      # or none did, because `go test` reports a skip as success. Fails on any SKIP and on
      # a short count, so the gate cannot go inert again without CI saying so.
      - name: the parity gate actually ran
        run: |
          # First, before anything reads it. -r not -f: an UNREADABLE log produced exactly
          # the wrong-reason failure the awk-over-grep note below exists to avoid — awk's own
          # "can't open file" and no message from this step at all.
          [ -r record.log ] || { echo "record.log is missing or unreadable — the test step above produced no usable log"; exit 1; }
          if grep -q -- '--- SKIP' record.log; then
            echo "the parity gate SKIPPED — the oracle was not reachable:"; cat record.log; exit 1
          fi
          # awk, not `grep -c`: grep -c exits non-zero on a zero count, which under this
          # step's `bash -e` would abort here and report the wrong reason for the failure.
          # A floor PER TEST, not one total. A single aggregate is a product of fixtures and
          # oracles, so growth in one dimension masks collapse in another: at 50 fixtures,
          # losing the whole DroppedGates oracle would still count 100 and pass — which is
          # exactly the regression that oracle was added to fix.
          # Each oracle carries its OWN floor, because they are different widths: the three
          # fixture tables run 28 subtests apiece, StorePath runs one per env shape. A shared
          # floor of 25 cannot cover the fourth oracle, which runs 11. It was left out of this
          # loop when it was added, and deleting it — or emptying storePathCases — then left
          # every gate here green, measured. (Why it was left out is recorded nowhere, so this
          # comment no longer guesses at it, and the agent count that was here belongs in a commit
          # message, not in the tree.) The floor
          # of 11 pins the table's WIDTH as well as the test's existence; the per-case `expect:`
          # strings in the catalog pin neither — only 4 of the 11 case names are pinned by any
          # entry, because two of the five store-path entries share one `expect:` string.
          for spec in Convergence:25 CycleCount:25 DroppedGates:25 StorePath:11; do
            t=${spec%:*}; min=${spec#*:}
            # Exactly four spaces, which is how `go test -v` indents a depth-1 subtest.
            # Two reasons written here before were wrong, and the third is deliberately
            # narrow. A fixture NAME cannot carry the needle: go test replaces spaces with
            # underscores. A fixture's TEXT reaches the log only inside a failing t.Errorf,
            # and that is excluded by the `file.go:NN:` prefix on its first line, not by the
            # indent — only continuation lines are indented eight, so the earlier claim
            # about t.Errorf was false as a general statement. What is actually true, and
            # all that is claimed: a green log contains no t.Errorf output at all, so
            # nothing in one can match this but a subtest result. A deeper-nested parity
            # table would be indented eight and UNDER-count, which fails the floor rather
            # than passing it.
            c=$(awk -v t="$t" '$0 ~ "^    --- PASS: Test" t "MatchesThePython/" {n++} END{print n+0}' record.log)
            [ "$c" -ge "$min" ] || { echo "only $c $t parity subtests passed, expected at least $min"; cat record.log; exit 1; }
            echo "$c $t parity subtests compared against the Python"
          done

      # internal/push is the same situation one slice later: its parity gate compares the
      # whole push decision, disclosure wording included, against push-check.py. Same
      # oracle checkout, same skip-is-success problem, so the same three steps rather than
      # being folded into "everything else" — where a skip would be invisible again.
      - name: go test (push, with the oracle)
        env:
          REVIEW_LOOP_PUSH_CHECK: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/push-check.py
          REVIEW_LOOP_RUNLOG: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/runlog.py
        run: |
          go test -count=1 -v ./internal/push/ > push.log 2>&1 || { cat push.log; exit 1; }
          tail -5 push.log

      - name: the push parity gate actually ran
        run: |
          [ -r push.log ] || { echo "push.log is missing or unreadable — the test step above produced no usable log"; exit 1; }
          if grep -q -- '--- SKIP' push.log; then
            echo "the push parity gate SKIPPED — push-check.py was not reachable:"; cat push.log; exit 1
          fi
          # The decision table and the enumerated divergences, counted separately. A
          # divergence test is NOT a subtest of the table, and each is the only thing
          # asserting which side owns which answer — so an aggregate count would let one
          # vanish under a table that grew by one. Each is named individually for the same
          # reason the record floors are per-oracle.
          #
          # The table floor is 17, not 18: `absent from the store` moved OUT of it when the
          # empty-record block landed, because it stopped being an agreement case. A floor
          # that stayed at 18 would have had to be met by some other case, which is how a
          # count starts measuring the wrong thing.
          c=$(awk '$0 ~ "^    --- PASS: TestParityWithPushCheck/" {n++} END{print n+0}' push.log)
          [ "$c" -ge 17 ] || { echo "only $c push parity subtests passed, expected at least 17"; cat push.log; exit 1; }
          for d in TestTheDisclosureWordingDivergence TestTheEmptyRecordDivergence; do
            grep -q -- "--- PASS: $d" push.log || {
              echo "enumerated divergence $d was not compared against the Python"; cat push.log; exit 1; }
          done
          echo "$c push parity subtests compared against the Python, plus 2 enumerated divergences"

      # internal/report is the third in the same situation: its parity gate renders the whole
      # report body against pr-report.py. Same oracle checkout, same skip-is-success problem.
      - name: go test (report, with the oracle)
        env:
          REVIEW_LOOP_PR_REPORT: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/pr-report.py
          REVIEW_LOOP_RUNLOG: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/runlog.py
        run: |
          go test -count=1 -v ./internal/report/ > report.log 2>&1 || { cat report.log; exit 1; }
          tail -5 report.log

      - name: the report parity gate actually ran
        run: |
          [ -r report.log ] || { echo "report.log is missing or unreadable — the test step above produced no usable log"; exit 1; }
          # ONE skip is expected here and nowhere else: TestRealStoreParity renders every run
          # in the author's live store, which CI does not have and must not be given. Checked
          # as an allowlist of exactly one name rather than by relaxing the grep, so a second
          # test going inert still fails — which is the whole point of this step.
          unexpected=$(grep -- '--- SKIP' report.log | grep -v 'TestRealStoreParity' || true)
          if [ -n "$unexpected" ]; then
            echo "the report parity gate SKIPPED — pr-report.py was not reachable:"; cat report.log; exit 1
          fi
          grep -q -- '--- SKIP: TestRealStoreParity' report.log || \
            echo "note: TestRealStoreParity did not skip — CI appears to have a run store"
          # Per TABLE floors, for the reason the record floors are per-oracle: the agreement
          # table and the narrative table are different widths and measure different halves,
          # and one aggregate would let the narrative table vanish under a table that grew.
          for spec in TestParityWithPrReport:73 TestParityOnTheNarrative:5 \
                      TestTheEnumeratedRenderDivergences:5 \
                      TestWrongTypedFieldsAreRefusedAtTheLoad:13 \
                      TestThreeShapesCrashTheOracleAndAreRefusedHere:3; do
            t=${spec%:*}; min=${spec#*:}
            c=$(awk -v t="$t" '$0 ~ "^    --- PASS: " t "/" {n++} END{print n+0}' report.log)
            [ "$c" -ge "$min" ] || { echo "only $c $t subtests passed, expected at least $min"; cat report.log; exit 1; }
            echo "$c $t subtests compared against the Python"
          done
          # The two divergences with no subtests of their own. Each is the only thing
          # asserting which side owns which answer, so neither can be left to an aggregate.
          for d in TestTheDisclosureDivergenceReachesTheBody TestThePostDiagnosisDivergence; do
            grep -q -- "--- PASS: $d" report.log || {
              echo "enumerated divergence $d was not compared against the Python"; cat report.log; exit 1; }
          done

      - name: go test (everything else)
        # mapfile, not a bare $(...): the two packages above are excluded because they need the
        # oracle, and the word splitting that reassembles the rest is the mechanism, not an
        # accident — so quoting the substitution would pass the whole list as ONE argument and
        # silently test nothing. An array says that explicitly and clears the last actionlint
        # finding on this file, so a real one is not lost in a standing warning.
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v -e '/internal/record$' -e '/internal/push$' -e '/internal/report$')
          go test -count=1 "${pkgs[@]}"

      # A deleted catalog entry is silently accepted: the score is computed against
      # however many .mut files are present, so dropping one gives n-1/n-1 and a green
      # build with one fewer defect guarded. `mutate` only errors on an EMPTY catalog.
      # Raise the floor deliberately when adding entries; that edit is the review trail — and
      # LOWER it just as deliberately. It went 181 -> 180 when the empty-record block landed:
      # push-missing-run-note-only-on-refusals guarded the note's wording on a GRANTED push,
      # and an empty record can no longer grant, so its defect is unreachable by construction
      # rather than merely unguarded. A guard made obsolete by a fix is deleted and counted,
      # not left to score `survived` forever.
      # (The same gap was found and closed in the skills repo's workflow first.)
      - name: no catalog entry has gone missing
        run: |
          # A glob array, not `ls | wc -l`: wc counts LINES, so one filename containing a
          # newline counts twice and the floor passes with an entry deleted — the single
          # failure mode this step exists to prevent, and the only direction that fails
          # quietly. nullglob also makes the empty case 0 rather than a literal glob.
          shopt -s nullglob
          f=(mutations/*.mut)
          n=${#f[@]}
          # Zero is a different failure from n-1: the directory or the glob is gone, not one
          # file, and "was one deleted?" would name the wrong cause.
          [ "$n" -gt 0 ] || { echo "mutations/ has no .mut files at all"; exit 1; }
          [ "$n" -ge 199 ] || { echo "only $n mutations, expected at least 199 — was one deleted?"; ls mutations/; exit 1; }
          echo "$n mutations present"

      # The suite passing says nothing on its own. This reintroduces each defect in
      # mutations/ and requires the suite to notice. A survivor is a hole: the
      # defect could ship with CI green.
      # The oracle paths are exported HERE too, not just for the two parity steps. A catalog
      # entry whose `verify:` runs a parity test needs the oracle, and without it that test
      # calls t.Skip — which `go test` reports as SUCCESS, so the mutation SURVIVES and the
      # entry silently guards nothing. Measured the first time this step ever ran in CI (it
      # could not start before push.log was gitignored): 177/178, with
      # record-parity-trims-the-oracle-side-only the one survivor, caught locally and inert
      # here. Same skip-is-success hazard the two "parity gate actually ran" steps exist for,
      # one level down — in the catalog rather than in a test step.
      - name: mutation score
        env:
          REVIEW_LOOP_PUSH_CHECK: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/push-check.py
          REVIEW_LOOP_PR_REPORT: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/pr-report.py
          REVIEW_LOOP_RUNLOG: ${{ github.workspace }}/.parity-oracle/skills/review/review-loop/runlog.py
        run: go run ./cmd/looper mutate
