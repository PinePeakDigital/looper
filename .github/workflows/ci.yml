name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test -count=1 ./...

      # The suite passing says nothing on its own. This reintroduces each defect in
      # mutations/ and requires the suite to notice. A survivor is a hole: the
      # defect could ship with CI green.
      - name: mutation score
        run: go run ./cmd/looper mutate
